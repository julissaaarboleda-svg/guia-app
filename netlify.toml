[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# AI calls (especially ones that search the web) can take longer than the 10s default.
[functions."generate-text"]
  timeout = 26

# Reading a long statement line by line can take a while.
[functions."import-finance"]
  timeout = 26

# Backups read every record, which can take a few seconds.
[functions."backup"]
  timeout = 26

# Calendar sync feed: /cal/<token>.ics is served by the calendar function.
[[redirects]]
  from = "/cal/*"
  to = "/.netlify/functions/calendar/:splat"
  status = 200
  force = true

# React Router needs every unknown path to fall back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
